<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Tinda Bot</title>
<style>
:root{--bg:#0f1115;--panel:#161a21;--line:#242a34;--fg:#e6e6e6;--dim:#8b95a5;--ok:#4ade80;--bad:#f87171;--accent:#7cc4ff}
*{box-sizing:border-box}
body{margin:0;padding:12px 12px 28px;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:16px;margin:2px 0 2px}
.sub{color:var(--dim);font-size:12px;margin-bottom:10px}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
h2{font-size:12.5px;margin:2px 0 6px;color:var(--dim);font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.05);align-items:baseline}
.row:last-child{border-bottom:0}
.k{color:var(--dim);width:6.5em;flex:none;font-size:12.5px}
.v{flex:1;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
code{background:#0c0f14;padding:1px 4px;border-radius:4px;font-size:12.5px;word-break:break-all}
pre{margin:4px 0 0;padding:8px;background:#0c0f14;border-radius:8px;overflow:auto;font-size:11.5px;line-height:1.45;max-height:200px;white-space:pre-wrap}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
button{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);background:#13202e;color:var(--accent);font:inherit;cursor:pointer}
button.ghost{border-color:var(--line);color:var(--dim);background:transparent}
button:active{opacity:.7}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:rgba(74,222,128,.35)}
.pill.off{color:var(--bad);border-color:rgba(248,113,113,.35)}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--fg:#1b1f24;--dim:#68707c;--accent:#1f6feb}code,pre{background:#f0f2f5}}
</style>
</head>
<body>
<h1>Tinda Bot</h1>
<div class="sub" id="sub">读取中…</div>
<div id="root"></div>

<section id="upd">
  <h2>更新</h2>
  <div class="row"><div class="k">当前</div><div class="v" id="u-cur">读取中…</div></div>
  <div class="row"><div class="k">远端</div><div class="v" id="u-rem">还没检查</div></div>
  <div class="btns">
    <button id="u-check">检查更新</button>
    <button class="ghost" id="u-dl">下载新版本</button>
    <button class="ghost" id="u-copy">复制下载地址</button>
  </div>
  <div class="sub" style="margin:6px 0 0">管理器自带的检查会被 raw.githubusercontent 的 CDN 缓存拖几分钟；这里每次带时间戳取，绕开缓存。</div>
</section>

<script>
var MOD="/data/adb/modules/tinda-bot";
var DATA="/data/adb/tinda-bot";
var root=document.getElementById("root"), sub=document.getElementById("sub");
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function sh(cmd){
  if(!window.ksu||!ksu.exec){return Promise.resolve("");}
  // KernelSU 的 exec 有的版本直接回 stdout 字符串，有的回 {stdout}；两种都认。
  return Promise.resolve(ksu.exec(cmd)).then(function(r){
    if(r&&typeof r==="object")return String(r.stdout||r.out||"");
    return r==null?"":String(r);
  }).catch(function(){return "";});
}
function toast(m){try{if(window.ksu&&ksu.toast)ksu.toast(m);}catch(e){}}
function row(k,v,cls){return "<div class=\"row\"><div class=\"k\">"+esc(k)+"</div><div class=\"v"+(cls?" "+cls:"")+"\">"+v+"</div></div>";}
function pill(on,a,b){return "<span class=\"pill "+(on?"on":"off")+"\">"+esc(on?a:b)+"</span>";}
var TOKEN="", IP="", PORT="8443";
var CUR_VER="", CUR_CODE=0;
var REPO="LoveTinda/DSH-Napcat-Bot";
var ZIP_URL="https://raw.githubusercontent.com/"+REPO+"/dist/tinda-bot-magisk.zip";
var CHANGE_URL="https://github.com/"+REPO+"/blob/main/CHANGELOG.md";
// 三个都能直连的源：raw 主用；jsDelivr 与代理做兜底（国内网络 raw 常被拖慢）。
var PROP_MIRRORS=[
  "https://raw.githubusercontent.com/"+REPO+"/main/module.prop",
  "https://cdn.jsdelivr.net/gh/"+REPO+"@main/module.prop",
  "https://ghfast.top/https://raw.githubusercontent.com/"+REPO+"/main/module.prop"
];

/** 目的：取一段远程文本，带超时；失败 reject 出简短原因。 */
function fetchText(url,ms){
  return new Promise(function(res,rej){
    var ac=null, timer=null;
    try{ac=new AbortController();}catch(e){}
    timer=setTimeout(function(){try{ac&&ac.abort();}catch(e){} rej(new Error("超时"));},ms||9000);
    var opt={cache:"no-store"};
    if(ac)opt.signal=ac.signal;
    fetch(url,opt).then(function(r){
      clearTimeout(timer);
      if(!r.ok)return rej(new Error("HTTP "+r.status));
      r.text().then(res,function(e){rej(e);});
    },function(e){clearTimeout(timer);rej(e);});
  });
}

/** 目的：解析 module.prop 文本成对象。 */
function parseProp(t){
  var o={};
  String(t||"").split(String.fromCharCode(10)).forEach(function(l){
    var i=l.indexOf("=");
    if(i>0)o[l.slice(0,i).trim()]=l.slice(i+1).trim();
  });
  return o;
}

/** 目的：依次试镜像；成功返回 {prop,url}。 */
function fetchProp(i){
  i=i||0;
  if(i>=PROP_MIRRORS.length)return Promise.reject(new Error("所有源都不可达"));
  var url=PROP_MIRRORS[i]+"?ts="+Date.now();
  return fetchText(url,9000).then(function(txt){
    var p=parseProp(txt);
    if(!p.version)throw new Error("返回内容不是 module.prop");
    return {prop:p,url:url};
  }).catch(function(){return fetchProp(i+1);});
}

/** 目的：比较远端与本地版本，更新界面。 */
function checkUpdate(){
  var cur=document.getElementById("u-cur"), rem=document.getElementById("u-rem");
  cur.textContent=(CUR_VER||"?")+"（versionCode "+(CUR_CODE||"?")+"）";
  rem.textContent="检查中…";
  fetchProp(0).then(function(r){
    var rv=String(r.prop.version||"?");
    var rc=Number(r.prop.versionCode||0);
    if(rc>CUR_CODE){
      rem.innerHTML="有新版本 <b>"+esc(rv)+"</b>（code "+rc+"）→ 点「下载新版本」，再在管理器里「从本地安装」";
    }else if(rc===CUR_CODE){
      rem.textContent="已是最新（"+rv+"）";
    }else{
      rem.textContent="远端比本地旧（"+rv+" / code "+rc+"）：你可能装了测试版";
    }
    try{localStorage.setItem("tinda_upd",JSON.stringify({rv:rv,rc:rc,at:Date.now()}));}catch(e){}
  }).catch(function(e){
    rem.textContent="检查失败："+(e&&e.message||"网络不可达")+"（可点「下载新版本」直接在浏览器打开 zip）";
  });
}

/** 目的：在浏览器里打开 zip（Android 会走下载器），之后去管理器「从本地安装」。 */
function downloadUpdate(){
  toast("正在打开下载地址…");
  sh("am start --user 0 -a android.intent.action.VIEW -d '"+ZIP_URL+"' >/dev/null 2>&1; echo ok");
  setTimeout(function(){toast("下载完在管理器里「模块 → 从本地安装」");},1500);
}

/** 目的：复制 zip 地址，方便贴到别处下载。 */
function copyZip(){
  try{navigator.clipboard.writeText(ZIP_URL);toast("已复制下载地址");}catch(e){toast(ZIP_URL);}
}

function consoleUrl(modulePage){
  return "https://"+(IP||"127.0.0.1")+":"+PORT+(modulePage?"/module/":"/")+"?k="+encodeURIComponent(TOKEN);
}

function buttons(){
  var b=document.getElementById("btns");
  if(!b)return;
  b.children[0].onclick=function(){ act("start"); };
  b.children[1].onclick=function(){ act("stop"); };
  b.children[2].onclick=function(){ act("restart"); };
  b.children[3].onclick=function(){ openPage(true); };
  b.children[4].onclick=function(){ load(); };
}
function act(what){
  toast(what==="stop"?"正在停止…":"正在启动…");
  sh("sh "+MOD+"/bin/unit.sh "+what+" web >/tmp/tinda-act.log 2>&1; tail -n 2 /tmp/tinda-act.log").then(function(){
    setTimeout(load,600);
  });
}
function openPage(modulePage){
  if(!TOKEN){toast("还没有 token，先启动一次 web");return;}
  var url=consoleUrl(modulePage);
  sh("am start --user 0 -a android.intent.action.VIEW -d '"+url+"' >/dev/null 2>&1; echo ok").then(function(){
    toast("已用浏览器打开");
  });
}

function load(){
  Promise.all([
    sh("sed -n 's/^version=//p' "+MOD+"/module.prop | head -1"),
    sh("cat "+DATA+"/secrets/web.token 2>/dev/null"),
    sh("ip -4 addr show wlan0 2>/dev/null | sed -n 's/.*inet \\([0-9.]*\\).*/\\1/p' | head -1"),
    sh("sed -n 's/^WEB_PORT=//p' "+DATA+"/etc/tinda.conf 2>/dev/null | tail -1"),
    sh("if [ -f "+DATA+"/run/web.pid ] && kill -0 $(cat "+DATA+"/run/web.pid) 2>/dev/null; then echo up; else echo down; fi"),
    sh("sed -n 's/^AUTO_START=//p' "+DATA+"/etc/tinda.conf 2>/dev/null | tail -1"),
    sh("tail -n 10 "+DATA+"/logs/web.log 2>/dev/null"),
    sh("(ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -q ':3080 ' && echo up || echo down"),
    sh("(ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -q ':6700 ' && echo up || echo down"),
    sh("(ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -q ':6099 ' && echo up || echo down"),
    sh("openssl x509 -in "+DATA+"/secrets/tls.crt -noout -enddate 2>/dev/null | cut -d= -f2")
  ]).then(function(r){
    var ver=(r[0]||"").trim()||"?";
    TOKEN=(r[1]||"").trim();
    IP=(r[2]||"").trim();
    PORT=(r[3]||"").trim()||"8443";
    var webUp=(r[4]||"").indexOf("up")>=0;
    var auto=(r[5]||"").trim()||"web（缺省）";
    var logs=(r[6]||"").replace(/\s+$/,"");
    var dsh=(r[7]||"").indexOf("up")>=0, br=(r[8]||"").indexOf("up")>=0, nc=(r[9]||"").indexOf("up")>=0;
    var cert=(r[10]||"").trim();
    var html="";
    html+="<section><h2>模块</h2>";
    html+=row("版本",esc(ver));
    html+=row("开机自启",esc(auto));
    html+=row("目录","<code>"+esc(MOD)+"</code>");
    html+=row("数据","<code>"+esc(DATA)+"</code>");
    html+="</section>";
    html+="<section><h2>Web</h2>";
    html+=row("状态",pill(webUp,"运行中","未运行"));
    html+=row("地址","<code>"+esc("https://"+(IP||"<手机IP>")+":"+PORT+"/")+"</code>");
    html+=row("token",TOKEN?("<code>"+esc(TOKEN.slice(0,4))+"…"+esc(TOKEN.slice(-4))+"</code> <button class=\"ghost\" style=\"min-height:28px;padding:0 8px;font-size:12px\" id=\"cp\">复制</button>"):"（还没有，先启动）");
    if(cert)html+=row("证书到期",esc(cert));
    html+=row("下游",pill(dsh,"DSH 在线","DSH 离线")+" "+pill(br,"桥接在线","桥接离线")+" "+pill(nc,"NapCat 在线","NapCat 离线"));
    html+="<div class=\"btns\" id=\"btns\"><button>启动</button><button class=\"ghost\">停止</button><button class=\"ghost\">重启</button><button>打开控制台</button><button class=\"ghost\">刷新</button></div>";
    html+="</section>";
    html+="<section><h2>web.log</h2><pre>"+esc(logs||"（空）")+"</pre></section>";
    root.innerHTML=html;
    sub.textContent="更新于 "+new Date().toLocaleTimeString();
    buttons();
    var cp=document.getElementById("cp");
    if(cp)cp.onclick=function(){
      try{navigator.clipboard.writeText(TOKEN);toast("已复制 token");}catch(e){toast("复制失败，长按下面的地址");}
    };
  }).catch(function(e){
    sub.textContent="读取失败："+e.message;
  });
}

// 更新区按钮：一进页面就试一次（本地已缓存过就顺带显示出来）。
(function wireUpdate(){
  var b1=document.getElementById("u-check"), b2=document.getElementById("u-dl"), b3=document.getElementById("u-copy");
  if(b1)b1.onclick=checkUpdate;
  if(b2)b2.onclick=downloadUpdate;
  if(b3)b3.onclick=copyZip;
  try{
    var last=JSON.parse(localStorage.getItem("tinda_upd")||"null");
    if(last&&last.rv)document.getElementById("u-rem").textContent="上次检查："+last.rv+"（code "+last.rc+"，"+new Date(last.at).toLocaleString()+"）";
  }catch(e){}
})();

if(!window.ksu){
  sub.textContent="没有检测到 KernelSU WebUI 接口：请在模块页用「打开」进入；普通浏览器访问只能看静态说明。";
}else{
  try{if(ksu.fullScreen)ksu.fullScreen(true);}catch(e){}
  load();
}
</script>
</body>
</html>
