# 目的：桥接器单元的声明。
# 边界：桥接器自成一体（OneBot 11 入口 + DSH 后端），不依赖 NapCat 怎么装、DSH 怎么起。
NAME=bridge
TYPE=proot
CMD=$MODDIR/bin/run-app-proot.sh
# 健康口用 OneBot 的 6700：管理口 6701 常被上一轮残留的旧实例占着，
# 拿它探活会把「端口被僵尸占着」误判成「服务健康」。
HEALTH_PORT=6700
# stop 时按这些端口回收旧进程（管理口 6701、面板口 6702）。
EXTRA_PORTS=6701 6702
PID_FILE=$DATA/run/bridge.pid
LOG_FILE=$DATA/logs/bridge.log
STATE_DIR=$DATA/state/app
RESTART_MAX=10
BACKOFF_MAX=60
CONTRACT=dsh
