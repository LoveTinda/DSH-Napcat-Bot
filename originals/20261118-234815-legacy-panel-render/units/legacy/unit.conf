# 目的：原版 napcat-dsh-bridge 的 opt-in 单元；默认不启动，TYPE=exec 不碰挂载。
# 边界：只跑宿主 node，不 chroot、不 bind；配置在 $DATA/etc/legacy.json。
NAME=legacy
TYPE=exec
CMD=$MODDIR/bin/run-legacy.sh
PID_FILE=$DATA/run/legacy.pid
LOG_FILE=$DATA/logs/legacy.log
STATE_DIR=$DATA/state/legacy
RESTART_MAX=3
BACKOFF_MAX=60
CONTRACT=dsh
