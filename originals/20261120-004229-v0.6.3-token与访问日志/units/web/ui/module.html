<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tinda 模块信息</title>
<style>
:root{--bg:#0f1115;--panel:#161a21;--line:#242a34;--fg:#e6e6e6;--dim:#8b95a5;--ok:#4ade80;--bad:#f87171;--accent:#7cc4ff}
*{box-sizing:border-box}
body{margin:0;padding:.8rem .8rem 2rem;background:var(--bg);color:var(--fg);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:16px;margin:.2rem 0 .6rem}
.sub{color:var(--dim);font-size:12px;margin-bottom:.8rem}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.7rem .8rem;margin-bottom:.7rem}
section h2{font-size:13px;margin:0 0 .5rem;color:var(--dim);font-weight:600;letter-spacing:.02em}
.row{display:flex;gap:.6rem;padding:.24rem 0;border-bottom:1px dashed rgba(255,255,255,.05);align-items:baseline}
.row:last-child{border-bottom:0}
.k{color:var(--dim);width:7.5em;flex:none;font-size:12.5px}
.v{flex:1;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)}.bad{color:var(--bad)}
code{background:#0c0f14;padding:.06rem .3rem;border-radius:4px;font-size:12.5px}
pre{margin:.4rem 0 0;padding:.55rem;background:#0c0f14;border-radius:8px;overflow:auto;font-size:11.5px;line-height:1.45;max-height:15rem;white-space:pre-wrap}
button{min-height:44px;padding:0 .9rem;border-radius:10px;border:1px solid var(--accent);background:#13202e;color:var(--accent);font:inherit;cursor:pointer}
button:active{opacity:.7}
.pill{display:inline-block;padding:.05rem .45rem;border-radius:999px;font-size:11.5px;border:1px solid var(--line)}
.pill.on{color:var(--ok);border-color:rgba(74,222,128,.35)}
.pill.off{color:var(--bad);border-color:rgba(248,113,113,.35)}
@media (prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--fg:#1b1f24;--dim:#68707c;--accent:#1f6feb}code,pre{background:#f0f2f5}}
</style>
</head>
<body>
<h1>Tinda 模块信息</h1>
<div class="sub" id="stamp">读取中…</div>
<div id="root"></div>
<script>
var root = document.getElementById("root");
var stamp = document.getElementById("stamp");
function el(tag, cls, text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=String(text);return n;}
function row(k, v, cls){var r=el("div","row");r.appendChild(el("div","k",k));var val=el("div","v"+(cls?" "+cls:""));if(v&&v.nodeType)val.appendChild(v);else val.textContent=v==null?"":String(v);r.appendChild(val);return r;}
function section(title){var s=el("section");s.appendChild(el("h2",null,title));return s;}
function code(text){return el("code",null,text);}
function pill(on, onText, offText){return el("span","pill "+(on?"on":"off"), on?onText:offText);}
function fmtUptime(sec){sec=Number(sec)||0;if(sec<60)return sec+" 秒";var m=Math.floor(sec/60);if(m<60)return m+" 分 "+(sec%60)+" 秒";var h=Math.floor(m/60);return h+" 时 "+(m%60)+" 分";}
function render(d){
  root.textContent="";
  var m=d.module, w=d.web, u=d.units;
  var s1=section("模块");
  s1.appendChild(row("名称", m.name+"  "+m.version+" ("+m.code+")"));
  s1.appendChild(row("安装目录", code(m.dir)));
  s1.appendChild(row("数据目录", code(m.data)));
  s1.appendChild(row("配置", code(m.conf)));
  s1.appendChild(row("开机自启", m.autoStart));
  s1.appendChild(row("说明", m.desc));
  root.appendChild(s1);
  var s2=section("Web 网关");
  s2.appendChild(row("监听", w.bind+":"+w.port));
  s2.appendChild(row("TLS", w.tls?pill(true,"已启用","—"):pill(false,"未启用","未启用")));
  if(w.cert && !w.cert.error){
    s2.appendChild(row("证书 SAN", w.cert.san));
    s2.appendChild(row("到期", w.cert.validTo));
  } else if(w.cert && w.cert.error){
    s2.appendChild(row("证书", "读取失败："+w.cert.error));
  }
  var tokWrap=el("span");
  tokWrap.appendChild(code(w.tokenMask));
  var btn=el("button",null,"复制完整 token");
  btn.style.marginLeft=".5rem";
  btn.onclick=function(){
    fetch("/module/token",{credentials:"same-origin"}).then(function(r){return r.json();}).then(function(j){
      if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(j.token).then(function(){btn.textContent="已复制";});}
      window.prompt("token", j.token);
    }).catch(function(e){btn.textContent="复制失败";});
  };
  tokWrap.appendChild(btn);
  s2.appendChild(row("token", tokWrap));
  s2.appendChild(row("token 文件", code(w.tokenFile)));
  s2.appendChild(row("已运行", fmtUptime(w.uptime)));
  s2.appendChild(row("内存 / 请求", w.rssMB+" MB / "+w.requests+" 次"));
  s2.appendChild(row("Node", w.node));
  var ports=[];
  if(w.originDsh)ports.push("/dsh → "+w.originDsh);
  if(w.originNapcat)ports.push("/napcat → "+w.originNapcat);
  if(w.redirect)ports.push("明文跳转 → "+w.redirect);
  if(w.plain)ports.push("明文直连 → "+w.plain);
  if(ports.length)s2.appendChild(row("附加端口", ports.join("    ")));
  root.appendChild(s2);
  var s3=section("下游");
  w.upstreams.forEach(function(x){
    var r=el("div","row");
    r.appendChild(el("div","k",x.path));
    var v=el("div","v");
    v.appendChild(pill(x.up,"在线","离线"));
    v.appendChild(document.createTextNode("  127.0.0.1:"+x.port));
    r.appendChild(v);
    s3.appendChild(r);
  });
  root.appendChild(s3);
  var s4=section("单元");
  Object.keys(u).forEach(function(name){
    var x=u[name];
    var v=el("div","v");
    v.appendChild(pill(x.alive,"运行中 pid "+x.pid,"未运行"));
    s4.appendChild(row(name,v));
  });
  root.appendChild(s4);
  [["web.log",d.logs.web],["supervisor.log",d.logs.supervisor]].forEach(function(pair){
    var s=section("日志 · "+pair[0]);
    var pre=el("pre",null,(pair[1]&&pair[1].length)?pair[1].join("\n"):"（空）");
    s.appendChild(pre);
    root.appendChild(s);
  });
  stamp.textContent="更新于 "+new Date().toLocaleTimeString();
}
function load(){
  fetch("/module/data.json",{credentials:"same-origin",cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }).then(render).catch(function(e){
    stamp.textContent="读取失败："+e.message+"（5 秒后重试）";
  });
}
load();
setInterval(load,5000);
</script>
</body>
</html>
