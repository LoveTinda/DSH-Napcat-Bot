# 目的：统一 Web 入口单元。把 DSH / 桥接面板 / NapCat WebUI 反代到同一个地址。
# 边界：只做转发与鉴权，不持有任何业务状态；下游没起来就显示离线，不报错退出。
NAME=web
TYPE=proot
CMD=$MODDIR/bin/run-web.sh
PID_FILE=$DATA/run/web.pid
LOG_FILE=$DATA/logs/web.log
STATE_DIR=$DATA/state/web
RESTART_MAX=20
BACKOFF_MAX=30
CONTRACT=none
# 就绪标记：网关真正开始监听时会打这一行。只有进程活着、标记没出现，就是「启动了但没在听」。
READY_MARKER=[web] listening
# 心跳：网关每 30 秒写一次；超过 HEARTBEAT_MAX 秒没更新就认为业务卡死（进程在、不响应），
# 由 unit.sh 重启整棵树。真机上 proot 会卡住而进程不退出，光看进程活着会误判为正常。
HEARTBEAT_FILE=$DATA/logs/web.hb
HEARTBEAT_MAX=100
