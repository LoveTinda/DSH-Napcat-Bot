<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<title>Tinda 控制台</title>
<style>
  :root{--bg:#0f1115;--panel:#161a21;--line:#242a34;--fg:#e6e6e6;--dim:#8b95a5;--ok:#4ade80;--bad:#f87171;--accent:#7cc4ff;--chip:#1e242e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;align-items:center;gap:.6rem;padding:.55rem .75rem;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .dots{display:flex;gap:.55rem;margin-left:auto;font-size:12px;color:var(--dim);flex-wrap:wrap}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3a4150;margin-right:.3rem;vertical-align:middle;flex:none}
  .dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
  .tools{display:flex;gap:.3rem;align-items:center}
  .tbtn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:.25rem .55rem;font-size:12px;cursor:pointer;white-space:nowrap}
  .tbtn:hover,.tbtn:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
  nav{display:flex;gap:.25rem;padding:.4rem .55rem;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:.34rem .85rem;border-radius:7px;font:inherit;cursor:pointer;white-space:nowrap}
  nav button.active{color:var(--fg);background:var(--chip);border-color:var(--line)}
  main{flex:1;position:relative;min-height:0;background:var(--bg)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.55rem;color:var(--dim);text-align:center;padding:1.5rem;background:var(--bg)}
  .hint strong{color:var(--fg);font-weight:600}
  .hint button{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:.4rem .9rem;font:inherit;cursor:pointer}
  #gate{position:fixed;inset:0;background:rgba(8,10,14,.94);display:flex;align-items:center;justify-content:center;padding:1.2rem;z-index:9}
  #gate .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.1rem;max-width:420px;width:100%}
  #gate h3{margin:0 0 .35rem;font-size:16px}
  #gate p{color:var(--dim);font-size:13px;margin:.25rem 0;line-height:1.55}
  #gate code{background:#0c0f14;padding:.08rem .3rem;border-radius:4px;font-size:12px;overflow-wrap:anywhere}
  #gate input{width:100%;padding:.6rem .7rem;border-radius:8px;border:1px solid var(--line);background:#0d1015;color:var(--fg);font:inherit;margin:.55rem 0}
  #gate button{width:100%;padding:.6rem;border-radius:8px;border:1px solid var(--accent);background:#13202e;color:var(--accent);font:inherit;cursor:pointer}
  #gate button:disabled{opacity:.55;cursor:wait}
  #err{color:var(--bad);min-height:1.2em}
  .hide{display:none!important}
  @media (max-width:520px){
    header{gap:.4rem}
    .dots{order:3;width:100%;justify-content:flex-start;margin-left:0}
    .tools{margin-left:auto}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Tinda 控制台</h1>
    <div class="dots" aria-live="polite">
      <span><i id="d-bridge" class="dot"></i>桥接</span>
      <span><i id="d-dsh" class="dot"></i>DSH</span>
      <span><i id="d-napcat" class="dot"></i>NapCat</span>
    </div>
    <div class="tools">
      <button class="tbtn" id="reload" type="button" title="重新加载当前面板">刷新面板</button>
      <a class="tbtn" href="/logout" title="清除登录 cookie" style="text-decoration:none">退出</a>
      <a class="tbtn" id="resetnap" href="#" target="_blank" title="NapCat 面板提示 token is invalid 时点这里：清掉它的本地登录态">重置面板</a>
    </div>
  </header>
  <nav role="tablist" aria-label="面板">
    <button data-k="bridge" class="active" role="tab" aria-selected="true">桥接器</button>
    <button data-k="dsh" role="tab" aria-selected="false">DSH</button>
    <button data-k="napcat" role="tab" aria-selected="false">NapCat</button>
  </nav>
  <main>
    <iframe id="view" title="面板" src="about:blank" referrerpolicy="no-referrer"></iframe>
    <div id="off" class="hint hide">
      <strong>这个面板还没起来</strong>
      <div id="offmsg" style="font-size:13px"></div>
      <button id="retry" type="button">重新检查</button>
    </div>
  </main>
</div>

<div id="gate">
  <div class="card">
    <h3>需要访问 token</h3>
    <p>从 <code>https://&lt;局域网IP&gt;:8443/?k=&lt;WEB_TOKEN&gt;</code> 进入，或在这里输入。token 在设备的 <code>secrets/web.token</code> 里。</p>
    <input id="tok" type="password" placeholder="token" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="go" type="button">进入</button>
    <p id="err" role="status"></p>
  </div>
</div>

<script>
// 各面板若是独立端口（值为 0 表示没有），就拼绝对地址进去：
// NapCat/DSH 的前端写死了绝对路径 /webui/assets、/api/…，塞在前缀下面必然白屏。
const PORTS = { dsh: __P_DSH__, napcat: __P_NAPCAT__ };
const KEYS = { bridge: '/bridge/', dsh: '/dsh/', napcat: '/napcat/' };
const NAMES = { bridge: '桥接器', dsh: 'DSH', napcat: 'NapCat' };

const view = document.getElementById('view');
const off = document.getElementById('off');
const offmsg = document.getElementById('offmsg');
const gate = document.getElementById('gate');
// 「重置面板」指向 NapCat 独立端口的 /reset：清掉浏览器里的登录态再回面板首页。
// NapCat 的凭据只存在浏览器里，换过 token 或过期就只能清掉重来。
(function wireReset() {
  const a = document.getElementById('resetnap');
  if (!a) return;
  const p = Number(PORTS.napcat || 0);
  a.href = p
    ? location.protocol + '//' + location.hostname + ':' + p + '/reset'
    : location.protocol + '//' + location.hostname + ':' + (location.port || 8443) + '/reset';
})();
const err = document.getElementById('err');
const tok = document.getElementById('tok');
const go = document.getElementById('go');

let current = 'bridge';
let loaded = false;
let timer = null;
let statusKnown = false;
let statuses = { bridge: false, dsh: false, napcat: false };

/** 目的：把独立端口拼成当前主机上的绝对地址；端口为 0 时退回 /bridge/ 这类前缀路径。 */
function panelUrl(k) {
  const port = Number(PORTS[k] || 0);
  if (!port) return KEYS[k];
  const u = new URL(location.href);
  u.port = String(port);
  u.pathname = '/';
  u.search = '';
  u.hash = '';
  return u.href;
}

/** 目的：切到某个面板；保持 iframe 的同源 cookie，不把 token 放进 URL。 */
function switchTo(k) {
  if (!KEYS[k]) return;
  current = k;
  document.querySelectorAll('nav button').forEach(function (b) {
    const on = b.dataset.k === k;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  if (!loaded || view.dataset.k !== k) {
    view.dataset.k = k;
    view.src = panelUrl(k);
  }
  loaded = true;
  if (statusKnown) showOff(!statuses[k]);
}

/** 目的：下游没起来时用遮罩说明，而不是把 iframe 的 502 文本直接糊在脸上。 */
function showOff(on) {
  if (!on) { off.classList.add('hide'); return; }
  offmsg.textContent = NAMES[current] + ' 现在不可达。看 bin/unit.sh status ' + current + ' 与对应日志。';
  off.classList.remove('hide');
}

function setDots(s) {
  for (const k of ['bridge', 'dsh', 'napcat']) {
    const d = document.getElementById('d-' + k);
    if (!d) continue;
    d.className = 'dot ' + (s[k] ? 'on' : 'off');
  }
}

/** 目的：检查 token 与三个下游状态；401 时显示 gate，其余错误显示离线提示。 */
async function refresh() {
  try {
    const r = await fetch('/_/status', { cache: 'no-store', credentials: 'same-origin' });
    if (r.status === 401) {
      gate.classList.remove('hide');
      off.classList.add('hide');
      setDots({ bridge: false, dsh: false, napcat: false });
      return;
    }
    if (!r.ok) {
      offmsg.textContent = '控制台状态接口返回 HTTP ' + r.status + '。';
      off.classList.remove('hide');
      return;
    }
    const s = await r.json();
    statuses = s;
    statusKnown = true;
    gate.classList.add('hide');
    err.textContent = '';
    setDots(s);
    if (!loaded) switchTo(current);
    else showOff(!s[current]);
  } catch (e) {
    offmsg.textContent = '连不上控制台（网络或网关进程）。';
    off.classList.remove('hide');
  }
}

function schedule() {
  if (timer) clearInterval(timer);
  timer = null;
  if (!document.hidden) timer = setInterval(refresh, 4000);
}

document.querySelectorAll('nav button').forEach(function (b) {
  b.onclick = function () { switchTo(b.dataset.k); };
});

document.getElementById('reload').onclick = function () { view.src = panelUrl(current); };
document.getElementById('retry').onclick = refresh;

go.onclick = async function () {
  const t = tok.value.trim();
  if (!t) { err.textContent = '先填 token'; return; }
  go.disabled = true;
  err.textContent = '验证中…';
  try {
    const r = await fetch('/_/status?k=' + encodeURIComponent(t), { cache: 'no-store', credentials: 'same-origin' });
    if (r.ok) {
      err.textContent = '';
      gate.classList.add('hide');
      await refresh();
    } else if (r.status === 401) {
      err.textContent = 'token 不对';
    } else {
      err.textContent = '状态接口返回 HTTP ' + r.status;
    }
  } catch (e) {
    err.textContent = '网络错误，稍后重试';
  } finally {
    go.disabled = false;
  }
};

tok.addEventListener('keydown', function (e) { if (e.key === 'Enter') go.click(); });

document.addEventListener('visibilitychange', function () {
  schedule();
  if (!document.hidden) refresh();
});

// 首次带 ?k= 进来时，网关已经种好 HttpOnly cookie；这里把 token 从地址栏抹掉，
// 避免留在浏览历史/Referer 里。只在有 k 时改，不打扰 ?p= 直达。
(function cleanTokenFromUrl() {
  try {
    const u = new URL(location.href);
    if (!u.searchParams.has('k')) return;
    u.searchParams.delete('k');
    history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
  } catch (e) { /* 地址栏清理失败不影响使用 */ }
})();

// 支持直达某个面板：?p=napcat 或 #napcat
(function deepLink() {
  const q = new URLSearchParams(location.search).get('p');
  const want = (q || location.hash.replace(/^#/, '')).toLowerCase();
  if (KEYS[want]) switchTo(want);
  else switchTo('bridge');
})();

refresh();
schedule();
</script>
</body>
</html>
