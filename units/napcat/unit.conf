# 目的：NapCat 单元的声明。只描述「怎么起、PID/日志/状态放哪」，不描述业务。
# 边界：NapCat 是外部项目，本模块只负责拉起 + 探活 + 退避重启；不管它的登录/配置/版本。
# 形态：宿主直装（QQ + NapCat 同进程注入），不是容器。容器路线在免 root 的 proot 里跑不通 chroot。
NAME=napcat
TYPE=auto
CMD=$MODDIR/bin/napcat-start-host.sh
PID_FILE=$DATA/run/napcat.pid
LOG_FILE=$DATA/logs/napcat.log
STATE_DIR=$DATA/state/napcat
RESTART_MAX=10
BACKOFF_MAX=30
# 探活打 OneBot 的 HTTP 口：它起来了才算真的「能用」，进程在不算。
HEALTH_PORT=3001
CONTRACT=onebot
