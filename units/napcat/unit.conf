# 目的：NapCat 单元的声明。只描述“怎么起、PID/日志/状态放哪”，不描述业务。
NAME=napcat
TYPE=chroot
ROOTFS_KEY=NAPCAT_ROOTFS
ENTRY=/opt/napcat/start.sh
PID_FILE=$DATA/run/napcat.pid
LOG_FILE=$DATA/logs/napcat.log
STATE_DIR=$DATA/state/napcat
RESTART_MAX=10
BACKOFF_MAX=30
# 定位：NapCat 是外部项目。本模块只负责「拉起容器 + 探活 3001」，不管理它的登录、
# 配置、更新。装好、扫码、跑着，就够了。
HEALTH_PORT=3001
CONTRACT=onebot
