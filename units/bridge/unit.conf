# 目的：桥接器单元的声明。
# 边界：桥接器自成一体（OneBot 11 入口 + DSH 后端），不依赖 NapCat 怎么装、DSH 怎么起。
NAME=bridge
TYPE=proot
CMD=$MODDIR/bin/run-app-proot.sh
# 健康口用面板的 6702：这是面板真正监听的 HTTP 口（forward-ws 模式下 6700 没人监听）。
# 这个值只用于「按端口回收残留进程」，不参与探活判定。
HEALTH_PORT=6702
# stop 时顺带按端口回收旧进程：6700 是 OneBot 入口（仅 HTTP 模式由本进程监听），
# 6703/6704 是端口顺延后的落点——不收掉，下一轮又被自己占着。
EXTRA_PORTS=6700 6701 6703 6704
PID_FILE=$DATA/run/bridge.pid
LOG_FILE=$DATA/logs/bridge.log
STATE_DIR=$DATA/state/app
RESTART_MAX=10
BACKOFF_MAX=60
CONTRACT=dsh
